const box = document.getElementById("chapters");

data.forEach((ch,index)=>{

    const div=document.createElement("div");
    div.className="chapter";

    div.innerHTML=`
        <button onclick="openChapter(${index})">
            📚 ${ch.name}
        </button>

        <div id="sections${index}" class="section-buttons">

            <button onclick="showContent(${index},'notes')">
                📖 Notes
            </button>

            <button onclick="showContent(${index},'important')">
                ⭐ Important Questions
            </button>

            <button onclick="showContent(${index},'pyq')">
                📝 PYQ
            </button>

            <button onclick="showContent(${index},'dpp')">
                ✍️ DPP
            </button>

            <button onclick="showContent(${index},'revision')">
                🔄 Quick Revision
            </button>

            <button onclick="showContent(${index},'formula')">
                📌 Formulas
            </button>

            <div id="content${index}" class="content"></div>

        </div>
    `;

    box.appendChild(div);
});


function openChapter(index){

    document.querySelectorAll(".section-buttons")
    .forEach(x=>x.style.display="none");

    document.getElementById("sections"+index)
    .style.display="block";

    document.getElementById("content"+index)
    .style.display="none";
}


function showContent(index,type){

    const content=document.getElementById("content"+index);

    content.innerHTML="<h3>"+title(type)+"</h3><p>"+
        data[index][type]+"</p>";

    content.style.display="block";
}


function title(type){

    if(type=="notes") return "📖 Notes";
    if(type=="important") return "⭐ Important Questions";
    if(type=="pyq") return "📝 PYQ";
    if(type=="dpp") return "✍️ DPP";
    if(type=="revision") return "🔄 Quick Revision";
    if(type=="formula") return "📌 Formulas";

}
